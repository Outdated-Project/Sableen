[package]
name = "rust_lib_sableen"
version = "1.0.1"
edition = "2024"
license-file = "../LICENSE"
keywords = ["bvc2", "rust", "video", "ffi"]
homepage = "https://github.com/blueokanna/Sableen"


[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
flutter_rust_bridge = "=2.13.0"
courierust = { version = "1.1.3", default-features = false }
nextjson = { version = "0.1.5", features = ["derive"] }
recurse-x = { version = "0.2.6", default-features = false }
rustbinary = { version = "0.1.10", default-features = false, features = [
    "compact",
] }
tzcraft = { version = "0.1.2", default-features = false }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
